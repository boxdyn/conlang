[workspace]
members = [
    "compiler/cl-repl",
    "compiler/cl-typeck",
    "compiler/cl-interpret",
    "compiler/cl-structures",
    "compiler/cl-token",
    "compiler/cl-ast",
    "compiler/cl-parser",
    "compiler/cl-lexer",
    "repline",
]
resolver = "2"

[workspace.package]
repository = "https://github.com/boxdyn/conlang"
documentation = "https://docs.soft.fish"
version = "0.0.5"
authors = ["John <j@soft.fish>"]
edition = "2021"
license = "MIT"
publish = ["soft-fish"]
